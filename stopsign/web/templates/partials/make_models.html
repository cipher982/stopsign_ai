<div id="vehicleMakeModels" class="window">
    <div class="title-bar">
        <span class="title-bar-text">Top Make / Models</span>
    </div>
    <div class="window-body">
        {% if items %}
        <div class="vcard-grid">
            {% for item in items %}
            <div class="vcard">
                <div class="vcard-img-wrap">
                    <img src="{{ item.image_url }}" alt="{{ item.make_model }}" loading="lazy">
                </div>
                <div class="vcard-body">
                    <div class="vcard-name">{{ item.make_model }}</div>
                    <div class="vcard-count">{{ "{:,}".format(item.count) }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div style="font-size: 12px; color: var(--text-dim);">No make/model data.</div>
        {% endif %}
    </div>
</div>
