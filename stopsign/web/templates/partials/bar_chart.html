<div id="{{ div_id }}" class="window">
    <div class="title-bar">
        <span class="title-bar-text">{{ title }}</span>
    </div>
    <div class="window-body">
        {% if items %}
        {% for item in items %}
        <div class="bar-row">
            <div class="bar-row-label">
                {% if item.color is defined %}
                <span class="color-chip" style="background-color: {{ item.color }};"></span>
                {% endif %}
                {{ item.label | title }}
            </div>
            <div class="bar-row-track bar-track">
                <div class="bar" style="width: {{ item.pct }}%; background: var(--text-dim);"></div>
            </div>
            <div class="bar-row-value">{{ "{:,}".format(item.value) }}</div>
        </div>
        {% endfor %}
        {% else %}
        <div style="font-size: 12px; color: var(--text-dim);">No data available.</div>
        {% endif %}
    </div>
</div>
