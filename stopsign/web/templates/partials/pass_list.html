<div id="{{ div_id }}" class="window">
    <div class="title-bar {% if 'Best' in title %}title-bar-inactive{% endif %}">
        <span class="title-bar-text">{{ title }}</span>
    </div>
    <div class="window-body">
        <div class="records-section-label">By Speed</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width: 84px;"></th>
                    <th>When</th>
                    <th>Verdict</th>
                    <th>Duration</th>
                    <th style="width: 60px;"></th>
                </tr>
            </thead>
            <tbody>
                {% for item in speed_passes %}
                {% include "partials/pass_item_row.html" %}
                {% endfor %}
            </tbody>
        </table>

        <div class="records-section-label">By Time in Zone</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width: 84px;"></th>
                    <th>When</th>
                    <th>Verdict</th>
                    <th>Duration</th>
                    <th style="width: 60px;"></th>
                </tr>
            </thead>
            <tbody>
                {% for item in time_passes %}
                {% include "partials/pass_item_row.html" %}
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
