<div id="vehicleGallery" class="window">
    <div class="title-bar">
        <span class="title-bar-text">Cluster Gallery</span>
    </div>
    <div class="window-body">
        {% if items %}
        <div class="vcard-grid">
            {% for item in items %}
            <div class="vcard">
                <div class="vcard-img-wrap">
                    <img src="{{ item.image_url }}" alt="{{ item.label }}" loading="lazy">
                </div>
                <div class="vcard-body">
                    <div class="vcard-name">{{ item.label }}</div>
                    {% if item.make_model or item.size %}
                    <div class="vcard-sub">{{ item.make_model }}{% if item.size %} ({{ item.size }}){% endif %}</div>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div style="font-size: 12px; color: var(--text-dim);">No cluster gallery data.</div>
        {% endif %}
    </div>
</div>
