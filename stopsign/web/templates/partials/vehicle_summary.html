<div id="vehicleSummary">
    {% if summary %}
    <div class="window">
        <div class="title-bar">
            <span class="title-bar-text">Vehicle Classification Summary</span>
        </div>
        <div class="window-body">
            <div class="stat-tiles">
                <div class="stat-tile">
                    <div class="stat-tile-label">Classified</div>
                    <div class="stat-tile-value">{{ "{:,}".format(summary.total_classified) }}</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-tile-label">Clusters</div>
                    <div class="stat-tile-value">{{ "{:,}".format(summary.cluster_count) }}</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-tile-label">Coverage</div>
                    <div class="stat-tile-value">{{ summary.coverage_pct }}%</div>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="window">
        <div class="title-bar title-bar-inactive">
            <span class="title-bar-text">Vehicle Classification Summary</span>
        </div>
        <div class="window-body" style="font-size: 12px; color: var(--text-dim);">
            Vehicle classification data not yet available.
        </div>
    </div>
    {% endif %}
</div>
