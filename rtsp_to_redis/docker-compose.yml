name: is844go80k088kcgo88s8cs8

services:
  rtsp_to_redis:
    build:
      context: ..
      dockerfile: rtsp_to_redis/Dockerfile
    env_file:
      - .env
    environment:
      - PROMETHEUS_PORT=${PROMETHEUS_PORT}
      - RTSP_URL=${RTSP_URL}
      - REDIS_URL=${REDIS_URL}
      - RAW_FRAME_KEY=${RAW_FRAME_KEY}
      - FRAME_BUFFER_SIZE=${FRAME_BUFFER_SIZE}
      - RTSP_JPEG_QUALITY=${RTSP_JPEG_QUALITY:-85}
      - RELEASE_GENERATION=${RELEASE_GENERATION:-unknown}
      - PROJECT_IDENTITY=${PROJECT_IDENTITY:-is844go80k088kcgo88s8cs8}
      # The camera link is WiFi and drops packets. Over UDP that shows up as corrupt
      # slices ("error while decoding MB", "missing reference picture") plus bursty,
      # starved delivery. RTSP-interleaved TCP retransmits instead of corrupting.
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=${OPENCV_FFMPEG_CAPTURE_OPTIONS:-rtsp_transport;tcp}
      - RTSP_FREEZE_DETECT_SEC=${RTSP_FREEZE_DETECT_SEC:-120}
      - RTSP_FREEZE_MAD_THRESHOLD=${RTSP_FREEZE_MAD_THRESHOLD:-0.015}
      - RTSP_FREEZE_RECONNECT_SEC=${RTSP_FREEZE_RECONNECT_SEC:-180}
      - RTSP_FREEZE_RECONNECT_COOLDOWN_SEC=${RTSP_FREEZE_RECONNECT_COOLDOWN_SEC:-60}
      # Arrival-rate guard: the MAD detector cannot see a live camera that is
      # delivering almost no frames. RTSP_RATE_WINDOW_SEC smooths the bursty
      # delivery a lossy link (and TCP retransmission) produces; 0 on the exit
      # stage allows a restart loop.
      - RTSP_MIN_INPUT_FPS=${RTSP_MIN_INPUT_FPS:-6}
      - RTSP_RATE_WINDOW_SEC=${RTSP_RATE_WINDOW_SEC:-10}
      - RTSP_LOW_FPS_RECONNECT_SEC=${RTSP_LOW_FPS_RECONNECT_SEC:-120}
      - RTSP_LOW_FPS_EXIT_SEC=${RTSP_LOW_FPS_EXIT_SEC:-900}
    command: >
      sh -c "stdbuf -oL -eL python rtsp_to_redis.py 2>&1 | stdbuf -oL -eL grep -vE '\\[h264 @ 0x[0-9a-f]+\\] SEI type 764 size [0-9]+ truncated at [0-9]+'"
    healthcheck:
      # /ready, not /healthz: an unhealthy container should read as unhealthy, so
      # `docker ps` and the deploy check show a starving camera instead of green.
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - default
      - monitoring
      - stopsign-net

networks:
  default:
  monitoring:
    name: monitoring
    external: true
  stopsign-net:
    name: stopsign-net
    external: true
