# Cube's default docker0 bridge may be unavailable after daemon/network churn,
# so image builds use host networking rather than that runtime bridge.

name: is844go80k088kcgo88s8cs8

services:

  # Capture is part of this release, not a separately managed auxiliary stack.
  # Keep the existing RTSP env file on cube as the secret authority; only the
  # producer image and code are rebuilt from this checkout.
  rtsp_to_redis:
    # Cube's default Docker bridge can lose its host device after network
    # churn; host-only build networking keeps release builds independent of
    # that runtime bridge. Service traffic still uses the explicit networks.
    build:
      network: host
      context: ../..
      dockerfile: rtsp_to_redis/Dockerfile
    env_file:
      - /home/drose/manual-apps/stopsign_ai/rtsp_to_redis/.env
    environment:
      RELEASE_GENERATION: ${RELEASE_GENERATION:-unknown}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      PROJECT_IDENTITY: ${PROJECT_IDENTITY:-is844go80k088kcgo88s8cs8}
      RTSP_HEALTH_KEY: ${RTSP_HEALTH_KEY:-stopsign.rtsp.health}
    command: >
      sh -c "stdbuf -oL -eL python rtsp_to_redis.py 2>&1 | stdbuf -oL -eL grep -vE '\\[h264 @ 0x[0-9a-f]+\\] SEI type 764 size [0-9]+ truncated at [0-9]+'"
    healthcheck:
      # /ready reports capture readiness; /healthz is liveness only.
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - default
      - monitoring
      - stopsign-net

  video_analyzer:
    build:
      context: ../..
      network: host
      dockerfile: docker/production/Dockerfile.processor
      args:
        YOLO_MODEL_NAME: ${YOLO_MODEL_NAME:-yolo11l.onnx}
        YOLO_MODEL_RELEASE: ${YOLO_MODEL_RELEASE:-v0.3.0-onnx}
    dns:
      - 100.100.100.100  # Tailscale MagicDNS for .ts.net names
      - 1.1.1.1          # Cloudflare fallback for public names (MinIO sslip.io, etc)
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT}
      RAW_FRAME_KEY: ${RAW_FRAME_KEY}
      PROCESSED_FRAME_KEY: ${PROCESSED_FRAME_KEY}
      YOLO_MODEL_NAME: ${YOLO_MODEL_NAME}
      DB_URL: ${DB_URL}
      ANALYZER_HEALTH_PORT: ${ANALYZER_HEALTH_PORT:-8081}
      ANALYZER_STALL_SEC: ${ANALYZER_STALL_SEC:-120}
      ANALYZER_HEALTH_KEY: ${ANALYZER_HEALTH_KEY:-stopsign.analyzer.health}
      RELEASE_GENERATION: ${RELEASE_GENERATION:-unknown}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      PROJECT_IDENTITY: ${PROJECT_IDENTITY:-is844go80k088kcgo88s8cs8}
      YOLO_DEVICE: ${YOLO_DEVICE:-cuda}
    volumes:
      - config-dir:/app/config
      - storage-dir:/app/data  # Shared volume for local vehicle images
    networks:
      - default
      - monitoring
      - stopsign-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:${ANALYZER_HEALTH_PORT:-8081}/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  ffmpeg_service:
    build:
      context: ../..
      network: host
      dockerfile: docker/production/Dockerfile.ffmpeg
    environment:
      REDIS_URL: ${REDIS_URL}
      PROCESSED_FRAME_KEY: ${PROCESSED_FRAME_KEY}
      FFMPEG_HEALTH_KEY: ${FFMPEG_HEALTH_KEY:-stopsign.ffmpeg.health}
      FFMPEG_ENCODER: ${FFMPEG_ENCODER}
      FFMPEG_PRESET: ${FFMPEG_PRESET}
      FFMPEG_HEALTH_PORT: ${FFMPEG_HEALTH_PORT:-8080}
      RELEASE_GENERATION: ${RELEASE_GENERATION:-unknown}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      PROJECT_IDENTITY: ${PROJECT_IDENTITY:-is844go80k088kcgo88s8cs8}
      # Restart the encoder when it has produced no fresh encoded evidence for
      # this long; mtime-only HLS checks are intentionally insufficient.
      PIPELINE_WATCHDOG_SEC: ${PIPELINE_WATCHDOG_SEC:-180}
    volumes:
      - storage-dir:/app/data
      - /mnt/hls-stream:/app/data/stream
    depends_on:
      - video_analyzer
    networks:
      - default
      - monitoring
      - stopsign-net
    # GPU removed - using libx264 software encoding instead of h264_nvenc
    healthcheck:
      # Probe composite readiness: Redis, source capture, and encoded HLS evidence.
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:${FFMPEG_HEALTH_PORT:-8080}/ready"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always

  web_server:
    build:
      context: ../..
      network: host
      dockerfile: docker/production/Dockerfile.web
    dns:
      - 100.100.100.100  # Tailscale MagicDNS for .ts.net names
      - 1.1.1.1          # Cloudflare fallback for public names
    ports:
      - ${WEB_SERVER_PORT}:8000
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      REDIS_URL: ${REDIS_URL}
      FFMPEG_HEALTH_KEY: ${FFMPEG_HEALTH_KEY:-stopsign.ffmpeg.health}
      ANALYZER_HEALTH_KEY: ${ANALYZER_HEALTH_KEY:-stopsign.analyzer.health}
      RTSP_HEALTH_KEY: ${RTSP_HEALTH_KEY:-stopsign.rtsp.health}
      TZ: America/Chicago
      RELEASE_GENERATION: ${RELEASE_GENERATION:-unknown}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      PROJECT_IDENTITY: ${PROJECT_IDENTITY:-is844go80k088kcgo88s8cs8}
    depends_on:
      - video_analyzer
    volumes:
      - storage-dir:/app/data
      - config-dir:/app/config
      - /mnt/hls-stream:/app/data/stream
    networks:
      - default
      - monitoring
      - stopsign-net
    healthcheck:
      # Web readiness checks the bounded DB dependency, not stream freshness.
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8000/readyz"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always

networks:
  default:
  monitoring:
    name: monitoring
    external: true
  stopsign-net:
    name: stopsign-net
    external: true

volumes:
  storage-dir:
  config-dir:
